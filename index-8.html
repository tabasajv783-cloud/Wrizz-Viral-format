:root {
  --bg: #08080c;
  --panel: #12121a;
  --panel2: #181822;
  --line: #272736;
  --text: #ececf4;
  --muted: #8a8aa0;
  --accent: #b026ff;
  --accent2: #6a00e6;
  --danger: #ff5a6e;
  --ok: #3ddc97;
  --warn: #ffb84d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
h2 { font-size: 16px; margin: 0 0 10px; }
h3 { font-size: 13px; margin: 0 0 8px; color: #d8d8ea; }
p { margin: 0 0 8px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #d68bff; outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 410px minmax(0, 1fr) 390px; grid-template-rows: auto minmax(0, 1fr) 352px; height: 100vh; }
.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.logo { font: italic 700 22px Poppins, Inter, sans-serif; color: #fff; letter-spacing: -0.5px; }
.logo b { color: #a83cff; font-weight: 700; }
.left, .right { overflow: auto; background: var(--panel); }
.left { grid-row: 2; border-right: 1px solid var(--line); }
.right { grid-row: 2; grid-column: 3; border-left: 1px solid var(--line); padding: 14px; }
.center { grid-row: 2; grid-column: 2; min-height: 0; display: flex; }
.bottom { grid-column: 1 / -1; grid-row: 3; background: var(--panel); border-top: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

.panel-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
.tab { flex: 1; background: none; border: 0; padding: 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; }
.tab.on { color: #fff; border-bottom-color: var(--accent); }

.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.inspector { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.space { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 4px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.strong { font-weight: 600; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.empty { color: var(--muted); padding: 18px 6px; text-align: center; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
input[type='text'], input[type='search'], input[type='number'], input[type='password'], select, textarea {
  background: #0c0c12; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0;
}
input.tiny { width: 64px; }
input[type='color'] { width: 44px; height: 30px; padding: 0; background: none; border: 1px solid var(--line); border-radius: 6px; }
input[type='range'] { width: 100%; accent-color: var(--accent); }
textarea { resize: vertical; }
textarea.mono, .mono { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.btn { background: #20202c; border: 1px solid #34344a; border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: #2a2a3a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 11px 18px; font-size: 15px; }
.btn.primary { background: linear-gradient(90deg, var(--accent2), #d100ff); border-color: transparent; color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.12); background: linear-gradient(90deg, var(--accent2), #d100ff); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; color: var(--muted); padding: 0; }
.icon-btn:hover:not(:disabled) { color: #fff; border-color: #55557a; }
.icon-btn:disabled { opacity: 0.3; }

details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.menu { position: relative; }
.menu > summary { list-style: none; display: inline-block; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: 36px; min-width: 230px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; z-index: 20; box-shadow: 0 12px 30px #000a; display: flex; flex-direction: column; }
.menu-item { background: none; border: 0; text-align: left; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.menu-item:hover { background: #26263a; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { background: #1c1c28; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip.on { background: #3a1466; border-color: #7a2ad0; color: #fff; }
.tag-input { width: 110px !important; padding: 2px 8px !important; font-size: 12px; border-radius: 999px !important; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; align-self: center; margin-bottom: 8px; }
.seg-btn { background: none; border: 0; padding: 5px 14px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg-btn.on { background: #3a1466; color: #fff; }

/* stage */
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 12px 16px; gap: 6px; background: radial-gradient(circle at 50% 30%, #1a1030, var(--bg) 70%); }
.stage-frame { flex: 1; min-height: 0; display: flex; justify-content: center; width: 100%; }
.stage-canvas { height: 100%; width: auto; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; background: #000; box-shadow: 0 10px 40px #000c, 0 0 0 1px #2a2a3d; }
.stage-info { color: var(--muted); font-size: 12px; }
.stage-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.stage-bar select { width: auto; padding: 5px 8px; }
.stage:not(.has-story) .stage-frame, .stage:not(.has-story) .stage-info, .stage:not(.has-story) .stage-bar, .stage:not(.has-story) .seg { display: none; }
.stage.has-story .stage-empty { display: none; }
.stage-empty { margin: auto; text-align: center; max-width: 360px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

.tl-item { position: relative; flex: 0 0 auto; width: 124px; cursor: pointer; border-radius: 10px; border: 2px solid transparent; padding: 3px; background: #0d0d14; }
.tl-item.sel { border-color: var(--accent); box-shadow: 0 0 0 3px #b026ff33; }
.tl-item.drag { opacity: 0.4; }
.tl-item.over { border-color: #fff; }
.tl-item .thumb { width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 7px; display: block; background: #000; pointer-events: none; }
.tl-num { position: absolute; top: 7px; left: 7px; background: #000b; border-radius: 6px; padding: 0 6px; font-size: 11px; font-weight: 700; }
.tl-type { display: block; text-align: center; font-size: 11px; color: var(--muted); padding-top: 3px; }
.t-app_promo .tl-type, .t-cta .tl-type { color: #d6a8ff; font-weight: 600; }

.msg-row { display: grid; grid-template-columns: 86px 1fr 28px; gap: 6px; align-items: start; }
.msg-row select.outgoing { border-color: #7a2ad0; }
.react-thumb { width: 100%; height: 260px; display: block; object-fit: contain; border-radius: 10px; background: #000; }
.react-thumb.ph { height: 140px; display: grid; place-items: center; color: var(--muted); border: 1px dashed #3a3a52; }

/* library */
.lib-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.lib-card { gap: 8px; }
.lib-thumb { background: #000; border: 0; border-radius: 8px; padding: 0; cursor: zoom-in; height: 150px; display: block; }
.lib-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.lib-meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.big-preview { max-width: 100%; max-height: 70vh; display: block; margin: auto; border-radius: 10px; }
.avatar { border-radius: 50%; object-fit: cover; background: #2b2b35; flex: none; }

.dl-status { font-size: 12px; color: var(--muted); }

.tl-valid { border: 0; font: inherit; font-size: 12px; font-weight: 600; }

/** A random chat time for one story, e.g. "Today 11:20 PM" (evening to 2 AM). It is picked once per generated story. */
function randomClock(rng = Math.random) {
  const mins = 18 * 60 + Math.floor(rng() * 8 * 60); // 6:00 PM .. 1:59 AM
  const h24 = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  const h12 = h24 % 12 || 12;
  return `Today ${h12}:${String(m).padStart(2, '0')} ${h24 >= 12 ? 'PM' : 'AM'}`;
}
/** The time shown on every DM slide of a story. Stories saved before this existed get a stable time derived from their id. */
function storyClock(story) {
  if (story && typeof story.clock === 'string' && story.clock.trim()) return story.clock.trim().slice(0, 24);
  let hsh = 7;
  for (const ch of String(story?.id || 'story')) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
  return randomClock(() => (hsh % 9973) / 9973);
}

/** Deep-merge saved settings over defaults so new fields always exist. */
function mergeSettings(saved) {
  const d = defaultSettings();
  if (!saved || typeof saved !== 'object') return d;
  const merge = (a, b) => {
    for (const k of Object.keys(b || {})) {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]);
      else if (b[k] !== undefined) a[k] = b[k];
    }
    return a;
  };
  const fresh = defaultSettings(); // untouched defaults (merge() below fills `d` in place)
  const old = saved.settingsVersion !== fresh.settingsVersion;
  const out = merge(d, saved);
  if (old) {
    // older builds saved the CTA as the app-demo design and fixed demo text: reset those to the new defaults
    out.settingsVersion = fresh.settingsVersion;
    out.brand.cta = fresh.brand.cta;
    out.brand.app_promo = fresh.brand.app_promo;
    if (saved.builder?.dmSlideCount === 12) out.builder.dmSlideCount = fresh.builder.dmSlideCount; // old default
    // the DM slide now looks like an iMessage screenshot: untouched old defaults move to the new defaults, own choices stay
    if (!saved.theme || saved.theme === 'wrizz') out.theme = fresh.theme;
    if (!saved.customIn || saved.customIn === '#2c2f38') out.customIn = fresh.customIn;
    if (!saved.customOut || saved.customOut === '#7737fa') out.customOut = fresh.customOut;
    if (saved.reactions && saved.reactions.mode !== 'random' && !saved.reactions.list) out.reactions.mode = saved.reactions.first === 1 && saved.reactions.every === 3 ? 'custom' : saved.reactions.mode;
    out.textStyle = ['classic', 'shadow', 'box'].includes(saved.textStyle) ? saved.textStyle : fresh.textStyle;
    out.imageFit = saved.imageFit === 'width' ? 'width' : fresh.imageFit;
    if (!Array.isArray(out.library?.people)) out.library = fresh.library;
    if (!out.library.people.length) out.library.people = fresh.library.people; // two sections to start with
    if (!['auto', 'art', 'library'].includes(out.library.titleSource) || out.library.titleSource === 'art') out.library.titleSource = 'auto'; // the title photo is picked automatically when there is one
    // a prompt written before the title image / 27-31 rules is kept as a saved prompt; the editor starts from the new default
    if (typeof saved.prompt === 'string' && !saved.prompt.includes('STORY TYPE')) {
      out.savedPrompts = [...(out.savedPrompts || []), { id: uid('p'), name: 'Previous prompt (before story types + exact slide count)', text: saved.prompt, ts: Date.now() }];
      out.prompt = null;
    } else if (typeof saved.prompt === 'string' && !saved.prompt.includes('SIDE-COMMENT STYLE')) {
      // the prompt gained the Gen Z side-comment rules: keep the old text as a saved prompt, start from the new default
      if (!(out.savedPrompts || []).some((p) => p.text === saved.prompt)) out.savedPrompts = [...(out.savedPrompts || []), { id: uid('p'), name: 'Previous prompt (before the Gen Z side comments)', text: saved.prompt, ts: Date.now() }];
      out.prompt = null;
    }
  }
  return out;
}

/** Bring a story saved by an older build up to date (CTA artwork, auto app-slide text). */
function migrateStory(story) {
  if (!story || !Array.isArray(story.slides)) return story;
  const oldDemo = new Set(['i know. i messed up', "you made my secret everyone's business"]);
  for (const sl of story.slides) {
    if (sl.type === 'cta' && sl.variant === 'demo') {
      sl.variant = 'original';
      sl.config = brandConfig('cta');
    }
    if (sl.type === 'app_promo' && sl.config?.demo) {
      const dm = sl.config.demo;
      if (oldDemo.has(dm.scannedText) && oldDemo.has(dm.reply)) {
        dm.scannedText = '';
        dm.reply = '';
        dm.scannedName = '';
      }
    }
  }
  return story;
}

function newBrandSlide(type, settings) {

const newCharacter = (name = 'Contact', avatarId = null) => ({

  avatarId,

const dmSlides = (story) => story.slides.filter((s) => s.type === 'dm');

/** The DM slides directly before / after an app slide. The app slide is about the one before it. */
function promoNeighbours(story, slideId) {
  const list = story.slides;
  const i = list.findIndex((x) => x.id === slideId);
  let prev = null;
  let next = null;
  let n = 0;
  for (let k = 0; k < i; k++) if (list[k].type === 'dm') (n++, (prev = list[k]));
  for (let k = i + 1; k < list.length; k++) if (list[k].type === 'dm') { next = list[k]; break; }
  return { prev, next, prevNumber: prev ? n : 0 };
}

/**
 * The reply WRizz recommends becomes the protagonist's next message: it is written as (or replaces) the
 * first message of the next DM slide, so the app slide and the story always match.
 */
function syncPromoReply(story, promo) {
  const { next } = promoNeighbours(story, promo.id);
  if (!next) return;
  const reply = String(promo.reply || '').trim();
  if (reply) {
    const first = next.messages[0];
    if (first && first.from === 'outgoing') first.text = reply;
    else next.messages.unshift({ id: uid('m'), from: 'outgoing', text: reply });
  } else {
    const out = next.messages.find((m) => m.from === 'outgoing');
    if (out) promo.reply = out.text;
  }
}

/** What the WRizz app screenshot shows: the message it "scanned" and the reply it recommends. */
function promoContent(story, slide) {
  const d = { ...brandConfig('promo').demo, ...(slide.config?.demo || {}) };
  const { prev, next } = promoNeighbours(story, slide.id);
  const msgs = prev?.messages || [];
  const lastIn = [...msgs].reverse().find((m) => m.from === 'incoming') || msgs[msgs.length - 1];
  const nextOut = (next?.messages || []).find((m) => m.from === 'outgoing');
  const ch = story.characters.find((c) => c.id === prev?.characterId) || story.characters[0];
  return {
    name: d.scannedName || ch?.name || 'Contact',
    time: storyClock(story),
    text: d.scannedText || lastIn?.text || 'we need to talk',
    // the reply WRizz shows IS the protagonist's next message: the first message of the next DM slide
    reply: (next?.messages[0]?.from === 'outgoing' && next.messages[0].text) || d.reply || slide.reply || nextOut?.text || "i hear you. let's talk about it calmly",
    hot: d.hot,
    insertLabel: d.insertLabel,
    regenLabel: d.regenLabel,
  };
}

// ------------------------------------------------------- promo / CTA logic
/** Insert exactly one app promo + one CTA as real slide objects (idempotent). */
function applyFixedSlides(story, settings, opts = {}) {
  const old = story.slides.find((s) => s.type === 'app_promo');
  const oldPrev = old ? promoNeighbours(story, old.id).prev?.id : null;
  story.slides = story.slides.filter((s) => s.type !== 'app_promo' && s.type !== 'cta');
  // title image: exactly one when enabled, always first (an existing one keeps its generated artwork)
  const titles = story.slides.filter((s) => s.type === 'title_image');
  story.slides = story.slides.filter((s) => s.type !== 'title_image');
  if (titleEnabled(settings)) story.slides.unshift(titles[0] || newTitleSlide(story.title || '', settings));
  const n = dmSlides(story).length;
  const k = promoAfterIndex(n, settings.promo);
  if (k >= 1) {
    let seen = 0;
    const idx = story.slides.findIndex((s) => s.type === 'dm' && ++seen === k);
    if (idx >= 0) {
      let at = idx + 1;
      while (story.slides[at]?.type === 'reaction') at++; // a side comment stays right after the slide it is about
      const promo = newBrandSlide('app_promo', settings);
      if (opts.promoReply) promo.reply = opts.promoReply;
      story.slides.splice(at, 0, promo);
      // keep the reply the AI wrote while the slide before it has not changed
      if (!opts.promoReply && old?.reply && oldPrev && promoNeighbours(story, promo.id).prev?.id === oldPrev) promo.reply = old.reply;
      syncPromoReply(story, promo);
    }
  }
  if (settings.cta.enabled) story.slides.push(newBrandSlide('cta', settings));
  return story;
}

/** A side comment is always about the DM slide right before it: keep aboutSlideId in step when slides move or are added. */
function relinkReactions(story) {
  let changed = false;
  story.slides.forEach((s, i) => {
    const prev = story.slides[i - 1];
    if (s.type === 'reaction' && prev && prev.type === 'dm' && s.aboutSlideId !== prev.id) {
      s.aboutSlideId = prev.id;
      changed = true;
    }
  });
  return changed;
}

/** The title image must always be the first slide. Returns true when something moved. */
function enforceTitleFirst(story) {
  const i = story.slides.findIndex((x) => x.type === 'title_image');
  if (i <= 0) return false;
  const [t] = story.slides.splice(i, 1);
  story.slides.unshift(t);
  return true;
}

/** The CTA must always be the last slide. Returns true when something moved. */
function enforceCtaLast(story) {
  const i = story.slides.findIndex((s) => s.type === 'cta');
  if (i === -1 || i === story.slides.length - 1) return false;
  const [cta] = story.slides.splice(i, 1);
  story.slides.push(cta);
  return true;
}

// -------------------------------------------------------- reaction logic
const TAG_RULES = [
  ['shocked', /\b(wait|what|omg|wtf|no way|seriously|you did what|huh|excuse me)\b|\?!|!\?/i],
  ['suspicious', /\b(why|who|since when|really|suspicious|explain|how come|lying|lie|sus)\b/i],
  ['sad', /\b(sorry|miss|cry|crying|hurt|alone|broke|goodbye|lost|tears)\b/i],
  ['romantic', /\b(love|babe|baby|kiss|date|cute|crush|heart)\b|[❤💕😘]/i],
  ['funny', /\b(lol|lmao|haha+|funny|joke|dead|bruh)\b|[😂🤣]/i],
  ['awkward', /\b(um+|uh+|awkward|oops|idk)\b|\.{3}|…/i],
  ['confident', /\b(watch me|obviously|easy|handled|i got this|trust me|deal with it|boss)\b/i],
];

function recommendTag(prevText = '', nextText = '') {
  for (const text of [prevText, nextText]) {
    for (const [tag, re] of TAG_RULES) if (re.test(text)) return tag;
  }
  return 'dramatic';
}

const firstMsg = (s) => s.messages[0] || { from: 'incoming', text: '' };
const lastMsg = (s) => s.messages[s.messages.length - 1] || { from: 'incoming', text: '' };

function transitionScore(a, b, t, n, rng) {
  let score = 1;
  if (lastMsg(a).from !== firstMsg(b).from) score += 1;
  if (/[?!]/.test(lastMsg(a).text + firstMsg(b).text)) score += 1;
  const tag = recommendTag(lastMsg(a).text, firstMsg(b).text);
  if (tag !== 'dramatic') score += 1.5;
  const pos = t / n;
  if (pos >= 0.2 && pos <= 0.85) score += 0.5;
  return score + rng() * 2;
}

/** Pick a real library image. Never invents assets; returns null for an empty library. */
function pickImage(library, tag, used, rng = Math.random) {
  if (!library.length) return null;
  const sets = [
    library.filter((i) => i.tags.includes(tag) && !used.has(i.id)),
    library.filter((i) => i.tags.includes(tag)),
    library.filter((i) => !used.has(i.id)),
    library,
  ];
  const set = sets.find((s) => s.length);
  return set[Math.floor(rng() * set.length)].id;
}

/**
 * Match the model's side comments to the wanted DM-slide positions. Exact slide numbers win; leftovers (the model
 * numbered a slide differently) are paired in story order, or with a neighbouring slide when the counts differ.
 * Returns Map(position -> {entry, moved}).
 */
function matchPlan(plan, positions) {
  const byPos = new Map();
  const left = [];
  for (const p of plan) {
    if (positions.includes(p.afterDm) && !byPos.has(p.afterDm)) byPos.set(p.afterDm, { entry: p, moved: false });
    else left.push(p);
  }
  const free = positions.filter((t) => !byPos.has(t));
  if (free.length && left.length) {
    if (free.length === left.length) free.forEach((t, i) => byPos.set(t, { entry: left[i], moved: left[i].afterDm !== t }));
    else {
      const pool = left.slice();
      for (const t of free) {
        pool.sort((a, b) => Math.abs(a.afterDm - t) - Math.abs(b.afterDm - t));
        if (pool.length && Math.abs(pool[0].afterDm - t) <= 1) byPos.set(t, { entry: pool.shift(), moved: true });
      }
    }
  }
  return byPos;
}

/**
 * Remove existing reaction slides and insert between settings.reactions.min..max new ones at
 * meaningful transitions between DM slides, using only real library images.
 * plan: [{afterDm, tag, caption}] suggestions (from the model) that are honoured when possible.
 */
function applyReactions(story, settings, library, { rng = Math.random, plan = [], avoidAfterDm = 0 } = {}) {
  const warnings = [];
  story.slides = story.slides.filter((s) => s.type !== 'reaction');
  const cfg = settings.reactions;
  if (!cfg.enabled) return { added: 0, warnings };
  if (cfg.mode !== 'random') return applyPatternReactions(story, cfg, library, { rng, plan });
  if (!library.length) {
    warnings.push('Reaction images are enabled but your library is empty (or has no images for the selected person), so no reaction slides were added.');
    return { added: 0, warnings };
  }
  const dms = dmSlides(story);
  const n = dms.length;
  const valid = [];
  for (let t = 1; t <= n - 1; t++) if (t !== avoidAfterDm) valid.push(t);
  const min = clamp(Math.round(cfg.min || 0), 0, 200);
  const max = Math.max(min, clamp(Math.round(cfg.max || 0), 0, 200));
  const target = Math.min(rngInt(min, max, rng), Math.ceil(n / 2), valid.length);

  const chosen = new Map(); // t -> {tag, caption}
  const adjacent = (t) => [...chosen.keys()].some((c) => Math.abs(c - t) <= 1);
  // every comment the model placed at a usable position is kept (it already carries its own text), up to the maximum
  for (const p of plan) {
    if (chosen.size >= max) break;
    if (valid.includes(p.afterDm) && p.caption && !chosen.has(p.afterDm) && !adjacent(p.afterDm)) chosen.set(p.afterDm, { tag: p.tag, caption: p.caption });
  }
  // when the model wrote enough comments, no extra caption-less slides are added
  const want = chosen.size >= min && plan.some((p) => p.caption) ? chosen.size : Math.max(target, chosen.size);
  while (chosen.size < want) {
    const cands = valid.filter((t) => !adjacent(t));
    if (!cands.length) break;
    let best = cands[0];
    let bestScore = -1;
    for (const t of cands) {
      const sc = transitionScore(dms[t - 1], dms[t], t, n, rng);
      if (sc > bestScore) {
        bestScore = sc;
        best = t;
      }
    }
    chosen.set(best, {});
  }

  const used = new Set();
  const usedCaps = new Set([...chosen.values()].map((c) => c.caption).filter(Boolean));
  const order = [...chosen.keys()].sort((a, b) => b - a); // insert from the end so indexes stay valid
  let missing = 0;
  for (const t of order) {
    const info = chosen.get(t);
    const tag = TAGS.includes(info.tag) ? info.tag : recommendTag(lastMsg(dms[t - 1]).text, firstMsg(dms[t]).text);
    const imageId = pickImage(library, tag, used, rng);
    used.add(imageId);
    const lib = library.find((i) => i.id === imageId);
    // a library caption is only a fallback, and never the same text twice
    let caption = info.caption || '';
    if (!caption && lib?.caption && !usedCaps.has(lib.caption)) (caption = lib.caption), usedCaps.add(caption);
    if (!caption) missing++;
    const slide = newReactionSlide(imageId, tag, caption, dms[t - 1].id);
    let seen = 0;
    const idx = story.slides.findIndex((s) => s.type === 'dm' && ++seen === t);
    story.slides.splice(idx + 1, 0, slide);
  }
  if (missing) warnings.push(`${missing} side-comment slide(s) have no text because the story did not include a comment for them. Write one in the Inspector.`);
  if (chosen.size < min) warnings.push(`Only ${chosen.size} reaction slide(s) fit; the minimum is ${min}.`);
  return { added: chosen.size, warnings };
}

/** Side-comment slides at fixed positions; each caption belongs to the DM slide directly before it. */
function applyPatternReactions(story, cfg, library, { rng, plan }) {
  const warnings = [];
  const dms = dmSlides(story);
  const positions = reactionPositions(dms.length, cfg);
  const used = new Set();
  let missing = 0;

      rr(ctx, cx - w / 2, top + i * lh + lh * 0.06, w, lh * 0.9, size * 0.22);
      ctx.fill();
    } else if (style === 'classic') {
      ctx.lineWidth = Math.max(6, size * 0.13);
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.96)' : 'rgba(0,0,0,.96)';
      ctx.strokeText(l, cx, by);
    } else {
      ctx.shadowColor = dark ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.6)';
      ctx.shadowBlur = sc(size * 0.22);
      ctx.shadowOffsetY = sc(size * 0.04);
    }
    ctx.fillStyle = col;
    ctx.fillText(l, cx, by);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  });
  ctx.restore();
}

// -------------------------------------------------------- reaction slide
// ---- side-comment text: centred on the slide by default, movable / resizable per slide
let measureCtx = null;
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function captionLayout(slide, ctx = null) {
  if (!ctx) {
    measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
    ctx = measureCtx;
  }
  const size = clampN(Number(slide.textSize) || 64, 24, 160);
  ctx.font = `700 ${size}px ${TT}`;
  const lines = slide.caption ? wrap(ctx, slide.caption, 900) : [];
  const lh = Math.round(size * 1.26);
  const w = Math.max(0, ...lines.map((l) => ctx.measureText(l).width));
  const hgt = lines.length * lh;
  const cx = clampN(Number.isFinite(slide.textX) ? slide.textX : 0.5, 0, 1) * W;
  const cy = clampN(Number.isFinite(slide.textY) ? slide.textY : 0.5, 0, 1) * H;
  return { lines, size, lh, w, h: hgt, cx, cy, x: cx - w / 2, y: cy - hgt / 2 };
}

/** Size a side-comment image is shown at on the 1080 x 1920 slide. 'exact' = its own pixels, 'width' = full slide width. */
function reactionImageBox(story, w, h) {
  const fit = Math.min(W / w, H / h); // the biggest size that still fits on the slide
  const k = story?.imageFit === 'width' ? fit : Math.min(1, fit);
  return { w: Math.round(w * k), h: Math.round(h * k), scaled: k !== 1 };
}

function drawReaction(ctx, story, slide, getBitmap) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const bmp = slide.imageId ? getBitmap(slide.imageId) : null;
  if (slide.background === 'blur' && bmp) {
    ctx.save();
    if ('filter' in ctx) ctx.filter = `blur(${sc(40)}px) brightness(0.45)`;
    else ctx.globalAlpha = 0.35;
    drawCover(ctx, bmp, -120, -120, W + 240, H + 240);
    ctx.restore();
  }
  // library images are drawn square-edged with no border, at their exact pixel size
  // (only an image bigger than the slide is scaled down to fit it; 'width' mode stretches it to the full slide width)
  let iw = 840;
  let ih = 1000;
  if (bmp) ({ w: iw, h: ih } = reactionImageBox(story, bmp.width, bmp.height));
  const x = Math.round((W - iw) / 2);
  const y = Math.round((H - ih) / 2);
  if (bmp) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, x, y, iw, ih);
    ctx.restore();
  } else {
    ctx.save();
    ctx.setLineDash([22, 18]);
    ctx.strokeStyle = '#4a4a52';
    ctx.lineWidth = 5;
    rr(ctx, x, y, iw, ih, 36);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6f6f78';
    ctx.font = `500 44px ${UI}`;
    ctx.textAlign = 'center';
    ctx.fillText(slide.imageId ? 'Image missing - replace it' : 'No image selected', W / 2, y + ih / 2 + 120);
    ctx.restore();
  }

  // the side comment sits on top of the image (default: dead centre) in the standard TikTok text style
  const L = captionLayout(slide, ctx);
  if (L.lines.length) tiktokText(ctx, story, L.lines, L.cx, L.y, L.lh, L.size, slide.textColor || '#ffffff');
}

// ----------------------------------------------------------- brand slides
function wordmarkRow(ctx, cx, cy, size) {
  ctx.save();
  ctx.font = `italic 700 ${size}px ${BR}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.lineJoin = 'round';
  const a = 'W';
  const b = 'Rizz';
  const wa = ctx.measureText(a).width;
  const wb = ctx.measureText(b).width;
  const overlap = size * 0.05;
  const x0 = cx - (wa + wb - overlap) / 2;
  const g = ctx.createLinearGradient(x0, 0, x0 + wa, 0);
  g.addColorStop(0, '#7a12ee');
  g.addColorStop(1, '#a83cff');
  ctx.lineWidth = size * 0.055;
  ctx.strokeStyle = g;
  ctx.fillStyle = g;
  ctx.strokeText(a, x0, cy);
  ctx.fillText(a, x0, cy);
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.strokeText(b, x0 + wa - overlap, cy);
  ctx.fillText(b, x0 + wa - overlap, cy);
  ctx.restore();
}

function wordmarkFit(ctx, cx, cy, targetW) {
  ctx.save();
  ctx.font = `italic 700 100px ${BR}`;
  const w = ctx.measureText('WRizz').width * 0.97;
  ctx.restore();
  wordmarkRow(ctx, cx, cy, (100 * targetW) / w);
}

function applePath(ctx, cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -0.28);
  ctx.bezierCurveTo(-0.14, -0.4, -0.46, -0.34, -0.46, 0.03);
  ctx.bezierCurveTo(-0.46, 0.3, -0.27, 0.5, -0.14, 0.48);
  ctx.bezierCurveTo(-0.07, 0.46, -0.04, 0.43, 0, 0.43);
  ctx.bezierCurveTo(0.04, 0.43, 0.07, 0.46, 0.14, 0.48);
  ctx.bezierCurveTo(0.27, 0.5, 0.46, 0.3, 0.46, 0.03);
  ctx.bezierCurveTo(0.46, -0.34, 0.14, -0.4, 0, -0.28);
  ctx.closePath();
  ctx.moveTo(0.02, -0.33);
  ctx.bezierCurveTo(-0.02, -0.55, 0.16, -0.64, 0.3, -0.6);
  ctx.bezierCurveTo(0.3, -0.46, 0.15, -0.35, 0.02, -0.33);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.5, -0.1, 0.17, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();
}

// The WRizz CTA artwork (square) scaled up so it fills the 9:16 slide. Its own edge colour continues
// above and below it, so the slide is one seamless dark-purple page.
let ctaEdge = null;
function ctaEdgeColors(bmp) {
  if (ctaEdge) return ctaEdge;
  const c = document.createElement('canvas');
  c.width = 1;
  c.height = 2;
  const x = c.getContext('2d', { willReadFrequently: true });
  const sx = Math.round(bmp.width * 0.2);
  const sw = Math.round(bmp.width * 0.6);
  x.drawImage(bmp, sx, 0, sw, 6, 0, 0, 1, 1);
  x.drawImage(bmp, sx, bmp.height - 6, sw, 6, 0, 1, 1, 1);
  const d = x.getImageData(0, 0, 1, 2).data;
  ctaEdge = [[d[0], d[1], d[2]], [d[4], d[5], d[6]]];
  return ctaEdge;
}

function drawOriginalCta(ctx, getBitmap) {
  const bmp = getBitmap('builtin:cta');
  if (!bmp) return false;
  const [t, b] = ctaEdgeColors(bmp);
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const dh = 1620; // image drawn 1620 x 1620: the sides are cropped (they are empty background)
  const dw = Math.round((bmp.width * dh) / bmp.height);
  const x = Math.round((W - dw) / 2);
  const y = Math.round((H - dh) / 2);
  ctx.fillStyle = rgb(t);
  ctx.fillRect(0, 0, W, H / 2);
  ctx.fillStyle = rgb(b);
  ctx.fillRect(0, H / 2, W, H / 2);
  ctx.drawImage(bmp, x, y, dw, dh);
  const F = 160;
  let g = ctx.createLinearGradient(0, y, 0, y + F);
  g.addColorStop(0, rgb(t, 1));
  g.addColorStop(1, rgb(t, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, y, W, F);
  g = ctx.createLinearGradient(0, y + dh - F, 0, y + dh);
  g.addColorStop(0, rgb(b, 0));
  g.addColorStop(1, rgb(b, 1));
  ctx.fillStyle = g;
  ctx.fillRect(0, y + dh - F, W, F);
  return true;
}

function drawBrand(ctx, story, slide, getBitmap) {
  const cfg = { ...brandConfig('promo'), ...(slide.config || {}) };
  if (slide.variant === 'demo') return drawDemo(ctx, story, slide, getBitmap);
  if (slide.variant === 'original' && drawOriginalCta(ctx, getBitmap)) return; // else: fall back to the redrawn brand card
  ctx.fillStyle = cfg.bgFrom;
  ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W / 2, 880, 40, W / 2, 880, 1150);
  bg.addColorStop(0, cfg.bgTo);
  bg.addColorStop(1, cfg.bgFrom);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = `700 104px ${BR}`;
  const head = cfg.headline ? wrap(ctx, cfg.headline, 940) : [];
  const hh = head.length * 128;
  const icon = 440;
  const hasHandle = cfg.showHandle !== false && cfg.handle;
  const hasBtn = !!cfg.buttonText;
  const parts = [hh ? hh + 90 : 0, icon + 70, 120 + 40, hasHandle ? 64 + 50 : 0, hasBtn ? 112 + 70 : 0, cfg.showBadge ? 150 : 0];
  const total = parts.reduce((a, b) => a + b, 0) - (cfg.showBadge ? 0 : 0);
  let y = Math.max(90, Math.round((H - total) / 2));

  ctx.fillStyle = '#fff';
  ctx.font = `700 104px ${BR}`;
  head.forEach((l, i) => ctx.fillText(l, W / 2, y + i * 128 + 100));
  y += hh ? hh + 90 : 0;

  // app icon with glow
  const ix = (W - icon) / 2;
  if (cfg.glow) {
    ctx.save();
    ctx.shadowColor = `rgba(150,70,255,${Math.min(1, 0.85 * cfg.glowStrength)})`;
    ctx.shadowBlur = sc(120 * cfg.glowStrength);
    ctx.fillStyle = '#000';
    rr(ctx, ix, y, icon, icon, 116);
    ctx.fill();
    ctx.shadowBlur = sc(50 * cfg.glowStrength);
    ctx.fill();
    ctx.restore();
  }
  const iconBmp = cfg.iconImageId ? getBitmap(cfg.iconImageId) : null;
  ctx.save();
  rr(ctx, ix, y, icon, icon, 116);
  ctx.clip();
  if (iconBmp) drawCover(ctx, iconBmp, ix, y, icon, icon);
  else {
    ctx.fillStyle = '#000';
    ctx.fillRect(ix, y, icon, icon);
  }
  ctx.restore();
  if (!iconBmp) {
    const logo = cfg.logoImageId ? getBitmap(cfg.logoImageId) : null;
    if (logo) {
      const s = Math.min((icon * 0.8) / logo.width, (icon * 0.5) / logo.height);
      ctx.drawImage(logo, W / 2 - (logo.width * s) / 2, y + icon / 2 - (logo.height * s) / 2, logo.width * s, logo.height * s);
    } else wordmarkRow(ctx, W / 2, y + icon / 2, 128);
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(170,110,255,.35)';
  ctx.lineWidth = 3;
  rr(ctx, ix, y, icon, icon, 116);
  ctx.stroke();
  ctx.restore();
  y += icon + 70;

  // wordmark
  let size = 132;
  ctx.font = `italic 700 ${size}px ${BR}`;
  while (ctx.measureText(cfg.wordmark || '').width > 900 && size > 40) {
    size -= 4;
    ctx.font = `italic 700 ${size}px ${BR}`;
  }
  const wmW = ctx.measureText(cfg.wordmark || '').width;
  const wg = ctx.createLinearGradient(W / 2 - wmW / 2, 0, W / 2 + wmW / 2, 0);
  wg.addColorStop(0, '#7a1bf0');
  wg.addColorStop(1, '#d2b4ff');
  ctx.fillStyle = wg;
  ctx.strokeStyle = wg;
  ctx.lineWidth = size * 0.04;
  ctx.lineJoin = 'round';
  ctx.strokeText(cfg.wordmark || '', W / 2, y + 96);
  ctx.fillText(cfg.wordmark || '', W / 2, y + 96);
  y += 160;

  if (hasHandle) {
    ctx.fillStyle = '#d6bcff';
    ctx.font = `700 58px ${BR}`;
    ctx.fillText(cfg.handle, W / 2, y + 50);
    y += 64 + 50;
  }
  if (hasBtn) {
    ctx.font = `700 54px ${BR}`;
    const bw = Math.max(460, ctx.measureText(cfg.buttonText).width + 150);
    const bx = (W - bw) / 2;
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#a23cff');
    g.addColorStop(1, '#dccaff');
    ctx.fillStyle = g;
    rr(ctx, bx, y, bw, 112, 56);
    ctx.fill();
    ctx.fillStyle = '#16091f';
    ctx.fillText(cfg.buttonText, W / 2, y + 74);
    y += 112 + 70;
  }
  if (cfg.showBadge) {
    const bw = 520;
    const bh = 150;
    const bx = (W - bw) / 2;
    ctx.fillStyle = '#000';
    rr(ctx, bx, y, bw, bh, 32);
    ctx.fill();
    ctx.strokeStyle = '#8b8b92';
    ctx.lineWidth = 4;
    rr(ctx, bx + 2, y + 2, bw - 4, bh - 4, 30);
    ctx.stroke();
    applePath(ctx, bx + 88, y + bh / 2 + 4, 96);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = `500 30px ${UI}`;
    ctx.fillText('Download on the', bx + 156, y + 56);
    ctx.font = `600 68px ${UI}`;
    ctx.fillText('App Store', bx + 152, y + 120);
    ctx.textAlign = 'center';
  }
  ctx.textAlign = 'left';
}

function magentaBracket(ctx, x, y, sx, sy) {
  ctx.beginPath();
  ctx.moveTo(x + sx * 172, y);
  ctx.lineTo(x + sx * 44, y);
  ctx.arcTo(x, y, x, y + sy * 44, 44);
  ctx.lineTo(x, y + sy * 172);
  ctx.stroke();
}

// ------------------------------------------------------------ title image
/** Pick the largest title size that fits in at most 4 wrapped lines. */
function titleLayout(slide, ctx = null) {
  if (!ctx) {
    measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
    ctx = measureCtx;
  }
  const text = String(slide.title || '').trim();
  let size = clampN(Number(slide.titleSize) || 104, 48, 220);
  let lines = [];
  for (; size >= 48; size -= 4) {
    ctx.font = `700 ${size}px ${TT}`;
    lines = text ? wrap(ctx, text, 920) : [];
    if (lines.length <= 4 && lines.every((l) => ctx.measureText(l).width <= 940)) break;
  }
  const lh = Math.round(size * 1.24);
  const cy = clampN(Number.isFinite(slide.titleY) ? slide.titleY : 0.6, 0.15, 0.9) * H;
  return { lines, size, lh, cy, y: cy - (lines.length * lh) / 2 };
}

function drawTitle(ctx, story, slide, getBitmap) {
  const bmp = slide.imageId ? getBitmap(slide.imageId) : null;
  if (bmp) {
    drawCover(ctx, bmp, 0, 0, W, H);
  } else {
    // honest placeholder: never pretend artwork exists
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a0638');
    g.addColorStop(1, '#07000f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.setLineDash([22, 18]);
    ctx.strokeStyle = '#7a4bd0';
    ctx.lineWidth = 5;
    rr(ctx, 90, 220, W - 180, 640, 36);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#b79cf0';
    ctx.textAlign = 'center';
    ctx.font = `600 50px ${UI}`;
    ctx.fillText(slide.imageId ? 'Artwork is missing' : 'No artwork generated yet', W / 2, 520);
    ctx.font = `500 38px ${UI}`;
    ctx.fillText('Use "Regenerate artwork" on this slide', W / 2, 590);
    ctx.restore();
  }
  // light neutral scrim behind the title so it stays readable on any artwork
  const L = titleLayout(slide, ctx);

/**
 * Draws the detective with its feet at (x, y) and the given height. `p` holds the theme's look:
 * line (body strokes), coat, hat, band, glow, face fill, lens glow, eyes.
 */
function drawDetective(ctx, x, y, hgt, p) {
  const lw = hgt * 0.02;
  const r = hgt * 0.085; // head radius
  const hy = y - hgt + r + hgt * 0.04; // head centre
  const shoulderY = hy + r * 1.55;
  const hipY = y - hgt * 0.36;
  const lean = p.lean || 0;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // long shadow on the ground
  if (p.shadow) {
    ctx.save();
    ctx.fillStyle = p.shadow;
    ctx.filter = 'blur(10px)';
    ellipse(ctx, x + hgt * 0.12, y + hgt * 0.015, hgt * 0.34, hgt * 0.03, -0.04);
    ctx.fill();
    ctx.restore();
  }

  const stroke = (pts, w = lw, c = p.line) => {
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.shadowColor = p.glow || 'transparent';
    ctx.shadowBlur = p.glow ? hgt * 0.03 : 0;
    ctx.beginPath();
    pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
    ctx.stroke();
  };

  // legs and shoes
  stroke([[x - hgt * 0.01, hipY], [x - hgt * 0.07, y - hgt * 0.1], [x - hgt * 0.085, y - hgt * 0.01]]);
  stroke([[x + hgt * 0.01, hipY], [x + hgt * 0.06, y - hgt * 0.1], [x + hgt * 0.09, y - hgt * 0.01]]);
  stroke([[x - hgt * 0.085, y - hgt * 0.005], [x - hgt * 0.14, y - hgt * 0.005]], lw * 1.5);
  stroke([[x + hgt * 0.09, y - hgt * 0.005], [x + hgt * 0.15, y - hgt * 0.005]], lw * 1.5);

  // trench coat: shoulders -> flared hem
  ctx.save();
  ctx.shadowColor = p.glow || 'transparent';
  ctx.shadowBlur = p.glow ? hgt * 0.025 : 0;
  ctx.fillStyle = p.coat;
  ctx.strokeStyle = p.line;
  ctx.lineWidth = lw * 0.8;
  ctx.beginPath();
  ctx.moveTo(x - hgt * 0.075 + lean, shoulderY);
  ctx.lineTo(x + hgt * 0.075 + lean, shoulderY);
  ctx.bezierCurveTo(x + hgt * 0.1, shoulderY + hgt * 0.12, x + hgt * 0.16, hipY + hgt * 0.06, x + hgt * 0.19, y - hgt * 0.2);
  ctx.lineTo(x - hgt * 0.19, y - hgt * 0.2);
  ctx.bezierCurveTo(x - hgt * 0.16, hipY + hgt * 0.06, x - hgt * 0.1, shoulderY + hgt * 0.12, x - hgt * 0.075 + lean, shoulderY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  // belt + buttons + turned-up collar
  stroke([[x - hgt * 0.115, hipY - hgt * 0.02], [x + hgt * 0.115, hipY - hgt * 0.02]], lw * 0.9, p.band);
  stroke([[x, shoulderY + hgt * 0.03], [x, y - hgt * 0.2]], lw * 0.35, p.line);
  ctx.fillStyle = p.coat;
  ctx.strokeStyle = p.line;
  ctx.lineWidth = lw * 0.8;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + lean + s * hgt * 0.01, shoulderY - hgt * 0.015);
    ctx.lineTo(x + lean + s * hgt * 0.085, shoulderY - hgt * 0.05);
    ctx.lineTo(x + lean + s * hgt * 0.07, shoulderY + hgt * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // arms: left hand in a pocket, right hand holds the magnifying glass up to the light
  stroke([[x - hgt * 0.07 + lean, shoulderY + hgt * 0.02], [x - hgt * 0.14, hipY - hgt * 0.02], [x - hgt * 0.05, hipY + hgt * 0.02]], lw * 1.1);
  const hand = [x + hgt * 0.27 + lean, shoulderY - hgt * 0.09];
  stroke([[x + hgt * 0.07 + lean, shoulderY + hgt * 0.02], [x + hgt * 0.17, shoulderY + hgt * 0.1], hand], lw * 1.1);
  // magnifying glass
  const lr = hgt * 0.085;
  const lx = hand[0] + hgt * 0.07;
  const ly = hand[1] - hgt * 0.09;
  stroke([hand, [lx - lr * 0.7, ly + lr * 0.7]], lw * 1.2, p.band);
  ctx.save();
  ctx.shadowColor = p.lens;
  ctx.shadowBlur = hgt * 0.07;
  ctx.fillStyle = rgba(p.lens, 0.28);
  ellipse(ctx, lx, ly, lr, lr);
  ctx.fill();
  ctx.strokeStyle = p.band;
  ctx.lineWidth = lw * 1.1;
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = lw * 0.4;
  ctx.beginPath();
  ctx.arc(lx, ly, lr * 0.66, Math.PI * 1.15, Math.PI * 1.55);
  ctx.stroke();

  // neck + head
  stroke([[x + lean * 0.5, hy + r], [x + lean, shoulderY]], lw);
  ctx.save();
  ctx.shadowColor = p.glow || 'transparent';
  ctx.shadowBlur = p.glow ? hgt * 0.03 : 0;
  ctx.fillStyle = p.face;
  ctx.strokeStyle = p.line;
  ctx.lineWidth = lw;
  ellipse(ctx, x, hy, r, r);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  // face: one sharp raised brow, two watchful eyes, a flat mouth
  ctx.fillStyle = p.eyes;
  for (const s of [-1, 1]) {
    ellipse(ctx, x + s * r * 0.38, hy + r * 0.1, r * 0.11, r * 0.15);
    ctx.fill();
  }
  stroke([[x - r * 0.65, hy - r * 0.18], [x - r * 0.12, hy - r * 0.3]], lw * 0.45, p.line);
  stroke([[x + r * 0.15, hy - r * 0.32], [x + r * 0.62, hy - r * 0.12]], lw * 0.45, p.line);
  stroke([[x - r * 0.3, hy + r * 0.55], [x + r * 0.28, hy + r * 0.5]], lw * 0.4, p.line);

  // fedora
  ctx.save();
  ctx.shadowColor = p.glow || 'transparent';
  ctx.shadowBlur = p.glow ? hgt * 0.025 : 0;
  ctx.fillStyle = p.hat;
  ctx.strokeStyle = p.line;
  ctx.lineWidth = lw * 0.7;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.88, hy - r * 0.55);
  ctx.bezierCurveTo(x - r * 0.9, hy - r * 1.9, x + r * 0.9, hy - r * 1.9, x + r * 0.88, hy - r * 0.55);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ellipse(ctx, x, hy - r * 0.55, r * 1.75, r * 0.42, -0.05);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  stroke([[x - r * 0.86, hy - r * 0.78], [x + r * 0.86, hy - r * 0.78]], lw * 0.8, p.band);
  ctx.restore();
}

// ------------------------------------------------------------------ backgrounds / atmosphere
function sky(ctx, L) {
  const g = ctx.createLinearGradient(0, 0, 0, ART_H);
  g.addColorStop(0, L.bg[0]);
  g.addColorStop(0.5, L.bg[1]);
  g.addColorStop(1, L.bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, ART_W, ART_H);
}

function lightCone(ctx, x, y, spread, len, color, a) {
  const g = ctx.createLinearGradient(x, y, x, y + len);
  g.addColorStop(0, rgbaStr(color, a));
  g.addColorStop(1, rgbaStr(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 20, y);
  ctx.lineTo(x + 20, y);
  ctx.lineTo(x + spread, y + len);
  ctx.lineTo(x - spread, y + len);
  ctx.closePath();
  ctx.fill();
}
const rgbaStr = rgba;

function bloom(ctx, x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 10, x, y, r);
  g.addColorStop(0, rgba(color, a));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, ART_W, ART_H);
}

function rain(ctx, rnd, color, n = 160, a = 0.25) {
  ctx.save();
  ctx.strokeStyle = rgba(color, a);
  ctx.lineWidth = 2;
  for (let i = 0; i < n; i++) {
    const x = rnd() * ART_W;
    const y = rnd() * ART_H;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 18, y + 70 + rnd() * 40);
    ctx.stroke();
  }
  ctx.restore();
}

function fog(ctx, rnd, color, y0, y1, n = 14, a = 0.07) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * ART_W;
    const y = y0 + rnd() * (y1 - y0);
    const g = ctx.createRadialGradient(x, y, 10, x, y, 260 + rnd() * 240);
    g.addColorStop(0, rgba(color, a));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, ART_W, ART_H);
  }
}

function skyline(ctx, rnd, color, base, minH, maxH, windows) {
  ctx.fillStyle = color;
  let x = -20;
  while (x < ART_W + 20) {
    const w = 70 + rnd() * 120;
    const h = minH + rnd() * (maxH - minH);
    ctx.fillRect(x, base - h, w, h + 400);
    if (windows) {
      for (let wy = base - h + 24; wy < base - 20; wy += 38) {
        for (let wx = x + 12; wx < x + w - 14; wx += 26) {
          if (rnd() > 0.72) {
            ctx.fillStyle = rgba(windows, 0.25 + rnd() * 0.55);
            ctx.fillRect(wx, wy, 12, 18);
          }
        }
      }
      ctx.fillStyle = color;
    }
    x += w + 4;
  }
}

const THEME_PAINT = {
  noir(ctx, rnd, L, cx) {
    sky(ctx, L);
    bloom(ctx, cx, 560, 760, L.glow, 0.22);
    skyline(ctx, rnd, '#08080a', 1130, 220, 520, L.glow);
    // venetian blind slats cut across the lamp light
    lightCone(ctx, cx, 120, 520, 1500, L.glow, 0.2);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    for (let y = 150; y < 1500; y += 64) ctx.fillRect(0, y, ART_W, 26);
    rain(ctx, rnd, '#d8d2c0', 170, 0.22);
    fog(ctx, rnd, '#8a8576', 900, 1500);
  },
  crimson(ctx, rnd, L, cx) {
    sky(ctx, L);
    bloom(ctx, cx, 520, 820, L.glow, 0.3);
    // investigation board: pinned photos joined by red string
    const photos = [];
    for (let i = 0; i < 7; i++) {
      const x = 90 + rnd() * 760;
      const y = 120 + rnd() * 700;
      const w = 130 + rnd() * 70;
      const h = w * 1.2;
      const a = (rnd() - 0.5) * 0.3;
      photos.push([x + w / 2, y + 10, x, y, w, h, a]);
    }
    ctx.save();
    ctx.globalAlpha = 0.5;
    photos.forEach(([, , x, y, w, h, a]) => {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(a);
      ctx.fillStyle = '#d8c8c0';
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = '#26090e';
      ctx.fillRect(-w / 2 + 10, -h / 2 + 10, w - 20, h - 36);
      ctx.restore();
    });
    ctx.restore();
    glowLine(ctx, photos.map((p) => [p[0], p[1]]), rgba(L.glow, 0.85), 4, 14);
    photos.forEach((p) => {
      ctx.fillStyle = L.glow;
      ellipse(ctx, p[0], p[1], 9, 9);
      ctx.fill();
    });
    fog(ctx, rnd, L.glow, 700, 1500, 10, 0.08);
  },
  violet(ctx, rnd, L, cx) {
    sky(ctx, L);
    bloom(ctx, cx, 520, 820, L.glow, 0.32);
    // hypnotic spiral behind the head and a chess floor in perspective
    ctx.save();
    ctx.translate(cx, 520);
    ctx.strokeStyle = rgba(L.accent, 0.35);
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let t = 0; t < 26; t += 0.08) {
      const r = 18 * t;
      ctx.lineTo(Math.cos(t) * r, Math.sin(t) * r);
    }
    ctx.stroke();
    ctx.restore();
    for (let row = 0; row < 9; row++) {
      for (let col = -9; col < 10; col++) {
        const y0 = 1060 + row * row * 9 + row * 24;
        const y1 = 1060 + (row + 1) * (row + 1) * 9 + (row + 1) * 24;
        const k = (y0 - 1060) / 700 + 0.5;
        if ((row + col) % 2) continue;
        ctx.fillStyle = rgba(L.glow, 0.1);
        ctx.beginPath();
        ctx.moveTo(ART_W / 2 + col * 70 * (1 + k * 0.9), y0);
        ctx.lineTo(ART_W / 2 + (col + 1) * 70 * (1 + k * 0.9), y0);
        ctx.lineTo(ART_W / 2 + (col + 1) * 70 * (1 + (k + 0.15) * 0.9), y1);
        ctx.lineTo(ART_W / 2 + col * 70 * (1 + (k + 0.15) * 0.9), y1);
        ctx.fill();
      }
    }
    // floating pawns
    for (let i = 0; i < 5; i++) {
      const x = 80 + rnd() * 920;
      const y = 150 + rnd() * 900;
      const s = 0.6 + rnd() * 0.9;
      ctx.fillStyle = rgba(L.accent, 0.3);
      ellipse(ctx, x, y - 26 * s, 17 * s, 17 * s);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 12 * s, y - 14 * s);
      ctx.lineTo(x + 12 * s, y - 14 * s);
      ctx.lineTo(x + 26 * s, y + 30 * s);
      ctx.lineTo(x - 26 * s, y + 30 * s);
      ctx.fill();
    }
  },
  midnight(ctx, rnd, L, cx) {
    sky(ctx, L);
    for (let i = 0; i < 140; i++) {
      ctx.fillStyle = rgba('#ffffff', 0.15 + rnd() * 0.7);
      const r = 1 + rnd() * 2.6;
      ellipse(ctx, rnd() * ART_W, rnd() * 1100, r, r);
      ctx.fill();
    }
    const mx = cx + (rnd() > 0.5 ? 220 : -220);
    bloom(ctx, mx, 330, 700, L.glow, 0.28);
    ctx.fillStyle = '#e8f1ff';
    ellipse(ctx, mx, 330, 130, 130);
    ctx.fill();
    ctx.fillStyle = L.bg[0];
    ellipse(ctx, mx + 52, 308, 112, 112);
    ctx.globalAlpha = 0.0;
    ctx.fill();
    ctx.globalAlpha = 1;
    skyline(ctx, rnd, '#02040d', 1130, 160, 460, '#ffd98a');
    fog(ctx, rnd, L.glow, 1000, 1500, 10, 0.06);
  },
  shadow(ctx, rnd, L, cx) {
    sky(ctx, L);
    bloom(ctx, cx, 600, 900, L.glow, 0.12);
    // a single narrow beam from above; everything else is dark
    lightCone(ctx, cx, 0, 340, 1300, '#cfeeea', 0.16);
    fog(ctx, rnd, L.glow, 700, 1600, 18, 0.07);
    // watching eyes in the dark
    for (let i = 0; i < 4; i++) {
      const x = 70 + rnd() * 940;
      const y = 200 + rnd() * 700;
      ctx.fillStyle = rgba(L.glow, 0.5 + rnd() * 0.4);
      ctx.shadowColor = L.glow;
      ctx.shadowBlur = 16;
      ellipse(ctx, x, y, 11, 5);
      ctx.fill();
      ellipse(ctx, x + 38, y, 11, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  },
  casefile(ctx, rnd, L, cx) {
    sky(ctx, L);
    // paper texture and a folder edge
    for (let i = 0; i < 700; i++) {
      ctx.fillStyle = `rgba(80,60,20,${rnd() * 0.06})`;
      ctx.fillRect(rnd() * ART_W, rnd() * ART_H, 2 + rnd() * 3, 2);
    }
    ctx.fillStyle = '#b7a982';
    ctx.fillRect(0, 0, ART_W, 90);
    ctx.fillStyle = '#9d8e68';
    ctx.fillRect(60, 0, 340, 130);
    // redaction bars like a case summary
    ctx.fillStyle = 'rgba(20,16,10,.85)';
    for (let i = 0; i < 9; i++) ctx.fillRect(80, 210 + i * 62, 220 + rnd() * 420, 30);
    // stamp ring + coffee ring + paperclip
    ctx.strokeStyle = rgba(L.accent, 0.75);
    ctx.lineWidth = 12;
    ellipse(ctx, 820, 330, 150, 150);
    ctx.stroke();
    ctx.lineWidth = 5;
    ellipse(ctx, 820, 330, 124, 124);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(90,50,20,.3)';
    ctx.lineWidth = 9;
    ellipse(ctx, 250, 1060, 90, 90);
    ctx.stroke();
    ctx.strokeStyle = '#6d6a64';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(930, 150, 50, 150, 24) : ctx.rect(930, 150, 50, 150);
    ctx.stroke();
    // inkblot (a nod to the psychological test)
    ctx.save();
    ctx.translate(cx, 480);
    ctx.fillStyle = 'rgba(27,23,18,.22)';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -120);
      ctx.bezierCurveTo(s * 160, -150, s * 230, -20, s * 130, 40);
      ctx.bezierCurveTo(s * 190, 110, s * 60, 170, 0, 120);
      ctx.fill();
    }
    ctx.restore();
  },
  academia(ctx, rnd, L, cx) {
    sky(ctx, L);
    // tall bookshelves
    for (let sh = 0; sh < 3; sh++) {
      const y = 150 + sh * 330;
      ctx.fillStyle = '#0e0804';
      ctx.fillRect(0, y + 270, ART_W, 26);
      let x = 6;
      while (x < ART_W) {
        const w = 24 + rnd() * 34;
        const h = 180 + rnd() * 80;
        ctx.fillStyle = ['#3a1d12', '#1f2c22', '#4a3216', '#2a1a30', '#512015'][Math.floor(rnd() * 5)];
        ctx.fillRect(x, y + 270 - h, w, h);
        ctx.fillStyle = rgba(L.accent, 0.5);
        ctx.fillRect(x + 4, y + 270 - h + 24, w - 8, 4);
        x += w + 2;
      }
    }
    bloom(ctx, cx + 250, 780, 760, L.glow, 0.32);
    // candle
    ctx.fillStyle = '#e8d8b0';
    ctx.fillRect(cx + 232, 790, 36, 120);
    ctx.shadowColor = L.glow;
    ctx.shadowBlur = 50;
    ctx.fillStyle = '#ffd488';
    ellipse(ctx, cx + 250, 764, 14, 30);
    ctx.fill();
    ctx.shadowBlur = 0;
    // dust motes in the warm light
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = rgba(L.glow, 0.1 + rnd() * 0.3);
      ellipse(ctx, rnd() * ART_W, rnd() * 1300, 2 + rnd() * 3, 2 + rnd() * 3);
      ctx.fill();
    }
  },
  neon(ctx, rnd, L, cx) {
    sky(ctx, L);
    bloom(ctx, cx, 560, 700, L.accent, 0.2);
    bloom(ctx, cx - 280, 900, 620, L.glow, 0.16);
    skyline(ctx, rnd, '#04020c', 1150, 200, 560, null);
    // neon outlines of buildings, signs and a lit question mark
    ctx.save();
    ctx.lineWidth = 5;
    for (let i = 0; i < 9; i++) {
      const x = rnd() * 900;
      const y = 260 + rnd() * 700;
      const w = 80 + rnd() * 140;
      const h = 120 + rnd() * 200;
      const c = i % 2 ? L.glow : L.accent;
      ctx.strokeStyle = c;
      ctx.shadowColor = c;
      ctx.shadowBlur = 28;
      ctx.strokeRect(x, y, w, h);
    }
    ctx.restore();
    ctx.save();
    ctx.font = '700 340px Poppins, Arial, sans-serif';

const { openSettings } = __m["settingsModal.js"];
const { exportAllPng, exportZip, exportJson, exportCurrentPng } = __m["export.js"];
const { importText } = __m["pipeline.js"];
const actions = __m["actions.js"];
const pipeline = __m["pipeline.js"];
// App bootstrap: layout, wiring, keyboard shortcuts.
















async function boot() {
  loadPersisted();
  await assets.init();
  await ensureFonts();

  const prompt = createPromptPanel();
  const library = createLibraryPanel();
  const characters = createCharactersPanel();
  const stage = createStage();
  const timeline = createTimeline();
  const inspector = createInspector();

  // ---------------------------------------------------------------- header
  const undoBtn = h('button', { class: 'btn sm', id: 'undo', onclick: () => undo() }, '↶ Undo');
  const redoBtn = h('button', { class: 'btn sm', id: 'redo', onclick: () => redo() }, '↷ Redo');
  const needStory = (fn) => () => (state.story ? fn().catch?.((e) => toast(e.message || String(e), { kind: 'error' })) : toast('Create or load a story first.', { kind: 'warn' }));
  const menu = h('details', { class: 'menu', id: 'export-menu' });
  const closeMenu = () => (menu.open = false);
  const item = (id, label, fn) => h('button', { class: 'menu-item', id, onclick: () => (closeMenu(), needStory(fn)()) }, label);
  menu.append(
    h('summary', { class: 'btn sm primary' }, 'Export ▾'),
    h('div', { class: 'menu-list' },
      item('exp-current', 'Download current slide (PNG)', exportCurrentPng),
      item('exp-bulk', 'All slides as separate PNG files', exportAllPng),
      item('exp-zip', 'ZIP + story.json + caption.txt', exportZip),
      item('exp-json', 'Story JSON', exportJson))
  );
  const importPicker = fileInput('.json,application/json', async (files) => {
    try {
      await importText(await files[0].text());
    } catch (e) {
      toast(e.message, { kind: 'error', ms: 7000 });
    }
  });
  const top = h(
    'header',
    { class: 'top' },
    h('div', { class: 'brand' }, h('span', { class: 'logo' }, h('b', {}, 'W'), 'Rizz'), h('span', { class: 'muted' }, 'Story generator')),
    h('div', { class: 'row' },
      undoBtn,
      redoBtn,
      h('button', { class: 'btn sm', id: 'preview-btn', onclick: () => (state.story ? openPreview() : toast('Create or load a story first.', { kind: 'warn' })) }, '▶ Preview'),
      menu,
      h('button', { class: 'btn sm', id: 'import-json', onclick: () => importPicker.open() }, 'Import JSON'),
      h('button', { class: 'btn sm', id: 'open-settings', onclick: () => openSettings() }, '⚙ Settings'))
  );

  // ------------------------------------------------------------------ tabs
  const panels = { prompt: prompt.el, library: library.el, characters: characters.el };
  const tabBar = h('div', { class: 'tabs', role: 'tablist' });
  let tab = 'prompt';
  const showTab = (t) => {
    tab = t;
    Object.entries(panels).forEach(([k, el]) => (el.hidden = k !== t));
    tabBar.querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.tab === t));
      b.classList.toggle('on', b.dataset.tab === t);
    });
    if (t === 'library') library.render();
    if (t === 'characters') characters.render();
  };
  [['prompt', 'Prompt'], ['library', 'Library'], ['characters', 'Characters']].forEach(([k, l]) =>
    tabBar.append(h('button', { role: 'tab', class: 'tab', id: `tab-${k}`, dataset: { tab: k }, onclick: () => showTab(k) }, l))
  );
  const left = h('aside', { class: 'left' }, tabBar, ...Object.values(panels));

  const app = $('#app');
  document.getElementById('boot')?.remove();
  app.append(h('div', { class: 'app' }, top, left, h('main', { class: 'center' }, stage.el), h('aside', { class: 'right' }, inspector.el), h('footer', { class: 'bottom' }, timeline.bar, timeline.el)));

  // ------------------------------------------------------------- updates
  const header = () => {
    undoBtn.disabled = !canUndo();
    redoBtn.disabled = !canRedo();
  };
  // Switching slides or re-drawing panels must never move what the person is looking at: the page, the side
  // panels and the thumbnail strip keep their scroll position, and the strip stays where the finger tapped.
  const rightCol = left.nextElementSibling?.nextElementSibling || null;
  function keepPosition(fn) {
    const anchor = timeline.el;
    const top0 = anchor.getBoundingClientRect().top;
    const keep = [left, rightCol, timeline.el].map((n) => (n ? [n, n.scrollTop, n.scrollLeft] : null));
    const winY = window.scrollY;
    fn();
    keep.forEach((k) => k && ((k[0].scrollTop = k[1]), (k[0].scrollLeft = k[2])));
    const d = anchor.getBoundingClientRect().top - top0;
    if (window.scrollY !== winY || d) window.scrollTo(window.scrollX, winY + d);
    timeline.keepVisible();
  }
  subscribe((scope) => {
    if (scope === 'busy' || scope === 'raw') return;
    header();
    keepPosition(() => {
      if (scope === 'art') {
        inspector.render();
        timeline.render();
        return;
      }
      if (scope === 'thumbs') {
        stage.render();
        timeline.render();
        return;
      }
      if (scope === 'all') {
        stage.render();
        inspector.render();
        timeline.render();
        if (tab === 'characters') characters.render();
        if (tab === 'library') library.render();
      } else if (scope === 'select') {
        stage.render();
        inspector.render();
        timeline.highlight();
        if (tab === 'library') library.render();
      } else if (scope === 'text') {
        stage.render();
        timeline.refreshSelectedThumb();
      }
    });
  });
  assets.onChange(() => {
    if (tab === 'library') library.render();
    if (tab === 'characters') characters.render();
    if (state.story) {
      stage.render();
      timeline.render();
      inspector.render();
    }
  });
  document.addEventListener('wrizz:open-settings', () => openSettings());
  document.addEventListener('wrizz:refresh-inspector', () => inspector.render());

  // ------------------------------------------------------------ shortcuts
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    const editing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    const mod = e.ctrlKey || e.metaKey;
    if (!mod || editing) return;
    if (e.key.toLowerCase() === 'z' && !e.shiftKey) (e.preventDefault(), undo());
    else if ((e.key.toLowerCase() === 'z' && e.shiftKey) || e.key.toLowerCase() === 'y') (e.preventDefault(), redo());
  });
  window.addEventListener('pagehide', flushPersist);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && flushPersist());

  window.__wrizz = { state, assets, actions, pipeline }; // handy for debugging in the console
  showTab('prompt');
  notify('all');
  actions.ensureTitleArt(); // a restored draft whose artwork is missing gets it generated again
}

boot().catch((e) => {
  console.error(e);
  document.body.append(h('pre', { class: 'fatal' }, `Failed to start: ${e.message}`));
});

return {  };
})();

</script>
</body></html>
